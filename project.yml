# The Xcode project is generated from this file: scripts/project.sh
name: Magnetite
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # StackForge's team at Apple. Signing a build for a device needs your own
    # (DEVELOPMENT_TEAM=… on the command line); the simulator needs none.
    DEVELOPMENT_TEAM: 5KRV4TD9X2
targets:
  Magnetite:
    type: application
    platform: iOS
    sources:
      - App
      # Generated by scripts/core.sh from ../magnetite-mobile-core.
      - Core/magnetite_mobile_core.swift
    dependencies:
      - framework: Core/MagnetiteCoreFFI.xcframework
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Magnetite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # One window, run by the scene delegate of App/MagnetiteApp.swift: a
        # tab's page can be on one screen only.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Web links from other apps, once Magnetite may be the default
        # browser: see docs/default-browser.md.
        CFBundleURLTypes:
          - CFBundleURLName: Web pages
            CFBundleURLSchemes: [http, https]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # A browser opens pages without https too. This covers web content
        # only; the app's own requests (sync) stay on https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        ITSAppUsesNonExemptEncryption: false
        # Downloads (Documents/Downloads) show in the Files app under the
        # app's name.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Websites ask through the system first, each site for itself.
        NSCameraUsageDescription: Scans the QR code of your sync code, and lets a website you allow use the camera. Magnetite keeps and sends nothing of it.
        NSMicrophoneUsageDescription: Lets a website you allow use the microphone, for a call for example. Magnetite keeps and sends nothing of it.
        NSLocationWhenInUseUsageDescription: Lets a website you allow know where you are, for a map for example. Magnetite keeps and sends nothing of it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.magnetitebrowser.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The core is built for Apple silicon simulators only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  MagnetiteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Magnetite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.magnetitebrowser.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  Magnetite:
    build:
      targets:
        Magnetite: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [MagnetiteUITests]
