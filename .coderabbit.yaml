# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews pull requests: useful, low noise, nothing kept or shared
# beyond the review itself.
language: en-US
tone_instructions: >-
  Be brief and concrete. Plain English. Only comment when something is wrong,
  risky or clearly simpler another way.
early_access: false

reviews:
  profile: chill
  # No automatic approvals or change requests; maintainers decide.
  auto_approvals:
    enabled: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["^main$"]
  path_filters:
    - "!App/Assets.xcassets/**"
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: >-
        Conventional Commits with a short subject, e.g. "fix(sync): keep the
        tabs of a space that is gone". Types: feat, fix, docs, refactor, test,
        build, ci, chore, perf.
  path_instructions:
    - path: "App/**"
      instructions: |
        The app promises: it never writes the chain's sidebar (it only reads it, through the
        core), and what it writes to the chain is its own entry among the devices. Tabs of
        private spaces are never listed for other devices and leave no site icon. The sync
        code stays in the device's key store. A site icon is only saved when a page of the
        site was loaded here; showing a row never contacts a site. No telemetry, no third-party
        services, no account. Flag any change that breaks one of these, and any new
        dependency.
        SwiftUI; pages are shown by WKWebView. Each profile of the chain is one website data
        store. The Xcode project is generated from project.yml and not in the repository.
        Comments: concise, above functions and types, updated with the code.
    - path: ".github/**"
      instructions: |
        Workflows pin every action to a full commit SHA and ask for no more than read access.
    - path: "**/*.md"
      instructions: |
        Plain, short English. Facts (commands, file names, versions) must match the
        repository. No marketing language.

chat:
  art: false
  auto_reply: false
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  # No data kept between reviews (learnings, indexed issues and PRs).
  opt_out: true
  web_search:
    enabled: false
  code_guidelines:
    enabled: true
    filePatterns:
      - README.md
      - CONTRIBUTING.md
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: disabled
  automatic_linking_mode: disabled

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
